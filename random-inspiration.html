<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机灵感生成器</title>
<style>
  :root {
    --paper: #F4F1EA;
    --ink: #1A1815;
    --ink-soft: #6B655C;
    --line: #DAD3C7;
    --accent: #E8552B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Georgia", "Songti SC", "Noto Serif SC", serif;
    display: flex;
    flex-direction: column;
    padding: clamp(24px, 5vw, 72px);
    gap: clamp(32px, 6vh, 64px);
    position: relative;
    overflow-x: hidden;
  }

  /* 纸张纹理 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,0.02) 0 1px, transparent 1px);
    background-size: 22px 22px, 34px 34px;
    mix-blend-mode: multiply;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 1080px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .clock {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  main { flex: 1; display: flex; flex-direction: column; gap: clamp(32px, 6vh, 64px); }

  h1 {
    font-size: clamp(40px, 9vw, 96px);
    line-height: 0.98;
    letter-spacing: -0.02em;
    font-weight: 400;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .hint {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 14px;
    letter-spacing: 0.05em;
  }

  /* 配色板 */
  .palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    border-radius: 4px;
    overflow: hidden;
  }

  .swatch {
    position: relative;
    aspect-ratio: 3 / 4;
    border: 1px solid rgba(0,0,0,0.08);
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    padding: 12px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.08em;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    user-select: none;
  }
  .swatch:hover { transform: translateY(-6px); }
  .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .swatch.copied::after {
    content: "已复制";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.65);
    color: #fff;
    text-shadow: none;
    font-size: 12px;
    letter-spacing: 0.1em;
    animation: fadeIn 0.2s ease;
  }

  /* 文案区 */
  .quote {
    display: flex;
    gap: clamp(16px, 3vw, 32px);
    align-items: flex-start;
    border-top: 1px solid var(--line);
    padding-top: clamp(24px, 5vh, 40px);
  }
  .quote .mark {
    font-size: clamp(48px, 8vw, 88px);
    line-height: 0.7;
    color: var(--accent);
    font-style: italic;
    flex: none;
  }
  .quote p {
    font-size: clamp(20px, 3.4vw, 34px);
    line-height: 1.35;
    max-width: 22ch;
  }
  .quote cite {
    display: block;
    margin-top: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    font-style: normal;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  button.generate {
    appearance: none;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    letter-spacing: 0.14em;
    padding: 16px 30px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
  }
  button.generate:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.generate:active { transform: scale(0.97); }
  button.generate:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .count {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* 动效 */
  .fade { animation: fadeIn 0.5s cubic-bezier(0.16,1,0.3,1); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .swatch:hover { transform: none; }
  }

  @media (max-width: 560px) {
    .palette { grid-template-columns: repeat(2, 1fr); }
    .swatch { aspect-ratio: 2 / 1; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">Random Inspiration Generator</span>
      <span class="clock" id="clock">--:--:--</span>
    </header>
  </div>

  <main class="wrap">
    <div>
      <h1>偶然的<em>灵感</em><br>随时生成</h1>
      <p class="hint">按 空格键 / S 重新生成 · 点击色块复制色值</p>
    </div>

    <section class="palette" id="palette" aria-label="随机配色板"></section>

    <blockquote class="quote" id="quote">
      <span class="mark">“</span>
      <div>
        <p id="quoteText"></p>
        <cite id="quoteAuthor"></cite>
      </div>
    </blockquote>
  </main>

  <footer class="wrap">
    <button class="generate" id="generateBtn">↻ 重新生成</button>
    <span class="count" id="count">第 0 次生成</span>
  </footer>

<script>
(function () {
  var quotes = [
    { t: "简单是终极的复杂。", a: "达·芬奇" },
    { t: "设计不是让东西好看，而是让东西好用。", a: "佚名" },
    { t: "秩序，是自由的第一步。", a: "勒·柯布西耶" },
    { t: "少即是多。", a: "密斯·凡·德·罗" },
    { t: "好点子来自大量的点子。", a: "莱纳斯·鲍林" },
    { t: "细节不是细节，细节成就设计。", a: "查尔斯·伊姆斯" },
    { t: "创造，就是把尚未存在的东西带进世界。", a: "佚名" },
    { t: "限制，往往是创造力的起点。", a: "佚名" },
    { t: "先做对，再做好，最后做美。", a: "佚名" },
    { t: "把复杂留给自己，把简单留给别人。", a: "佚名" },
    { t: "灵感偏爱有准备的头脑。", a: "路易·巴斯德" },
    { t: "颜色是会呼吸的情绪。", a: "佚名" },
    { t: "留白，也是一种表达。", a: "佚名" },
    { t: "完美不是无可增添，而是无可删减。", a: "圣埃克苏佩里" },
    { t: "每一个伟大的作品，都始于一个随机的念头。", a: "佚名" }
  ];

  var paletteEl = document.getElementById("palette");
  var quoteTextEl = document.getElementById("quoteText");
  var quoteAuthorEl = document.getElementById("quoteAuthor");
  var quoteEl = document.getElementById("quote");
  var countEl = document.getElementById("count");
  var clockEl = document.getElementById("clock");
  var btn = document.getElementById("generateBtn");
  var count = 0;

  function rnd(min, max) { return Math.random() * (max - min) + min; }
  function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }

  // HSL -> HEX
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    r = Math.round((r + m) * 255);
    g = Math.round((g + m) * 255);
    b = Math.round((b + m) * 255);
    return "#" + [r, g, b].map(function (v) {
      return v.toString(16).padStart(2, "0");
    }).join("").toUpperCase();
  }

  function makePalette() {
    var baseHue = rndInt(0, 359);
    var scheme = rnd(0, 1);
    var colors = [];
    for (var i = 0; i < 5; i++) {
      var hue;
      if (scheme < 0.5) {
        // 邻近色
        hue = (baseHue + rnd(-40, 40) + 360) % 360;
      } else {
        // 互补 + 三色
        hue = (baseHue + i * rnd(60, 130)) % 360;
      }
      var sat = rnd(45, 82);
      var light = 30 + i * 11 + rnd(-6, 6);
      light = Math.max(18, Math.min(88, light));
      colors.push(hslToHex(Math.round(hue), Math.round(sat), Math.round(light)));
    }
    return colors;
  }

  function render() {
    var colors = makePalette();
    paletteEl.innerHTML = "";
    colors.forEach(function (hex) {
      var el = document.createElement("div");
      el.className = "swatch fade";
      el.style.background = hex;
      el.textContent = hex;
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "复制色值 " + hex);
      function copy() {
        var done = function () {
          el.classList.add("copied");
          setTimeout(function () { el.classList.remove("copied"); }, 800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(hex).then(done, done);
        } else {
          var ta = document.createElement("textarea");
          ta.value = hex;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      }
      el.addEventListener("click", copy);
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copy(); }
      });
      paletteEl.appendChild(el);
    });

    var q = quotes[rndInt(0, quotes.length - 1)];
    quoteTextEl.textContent = q.t;
    quoteAuthorEl.textContent = "— " + q.a;
    quoteEl.classList.remove("fade");
    void quoteEl.offsetWidth;
    quoteEl.classList.add("fade");

    count++;
    countEl.textContent = "第 " + count + " 次生成";
  }

  btn.addEventListener("click", render);

  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "s" || e.key === "S") {
      var tag = (e.target || {}).tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      render();
    }
  });

  function tick() {
    var d = new Date();
    clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(function (n) { return String(n).padStart(2, "0"); })
      .join(":");
  }
  tick();
  setInterval(tick, 1000);

  render();
})();
</script>
</body>
</html>
